name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests with coverage
        run: bun run test:coverage
      - name: Build
        run: bun run build
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const s=require('./coverage/coverage-summary.json').total; console.log('Lines: '+s.lines.pct+'% | Statements: '+s.statements.pct+'% | Functions: '+s.functions.pct+'% | Branches: '+s.branches.pct+'%')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # The CLI is its own package with its own dependencies, so it needs its own
  # job: the root install does not reach cli/, and a suite nothing runs is a
  # suite that rots.
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bunx vitest run
      - name: Build
        run: bun run build
      - name: It actually runs
        run: |
          # printf, not echo: the CLI encodes stdin verbatim, so echo's
          # trailing newline becomes part of the answer (aGVsbG8K), exactly
          # as it does with coreutils base64.
          test "$(printf hello | ./dist/index.js base64-encode)" = "aGVsbG8="
          test "$(printf 'a\nb' | ./dist/index.js sort-lines)" = "$(printf 'a\nb')"
          ./dist/index.js --version

  # The Raycast extension is a third package with its own npm lockfile.
  # Its vendor test compares src/vendor byte for byte against cli/ and ide/,
  # so a CLI change that is not re-synced fails here. `ray lint` is left out:
  # it checks the author against the Raycast Store over the network.
  raycast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
